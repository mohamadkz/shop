# version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_service
    ports:
      - "5672:5672"   # پورت اصلی ارتباط لاراول با RabbitMQ
      - "15672:15672" # پورت پنل مدیریتی (در مرورگر با localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
